<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Measurement Converter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <h1>Measurement Converter</h1>

    <div class="form-group">
      <label for="category-select">Category</label>
      <select id="category-select"></select>
    </div>

    <div class="direction-container">
      <button id="direction-btn" class="direction-btn" type="button">
        <span id="direction-label">Metric → Imperial</span>
        <span class="swap-icon">⇆</span>
      </button>
    </div>

    <div class="converter-row">
      <div class="form-group">
        <label for="from-unit-select">From</label>
        <select id="from-unit-select"></select>
      </div>
      <div class="form-group">
        <label for="to-unit-select">To</label>
        <select id="to-unit-select"></select>
      </div>
    </div>

    <div class="form-group">
      <label for="value-input">Value</label>
      <input type="number" id="value-input" value="1" step="any">
    </div>

    <div class="result-box">
      <div class="result-label">Converted Result</div>
      <div id="result-display" class="result-value">0</div>
      <div id="formula-display" class="result-formula"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
